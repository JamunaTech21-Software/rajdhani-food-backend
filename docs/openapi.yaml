              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Delete a pack size
      description: A real `DELETE` — unlike the product and category modules, there is no other table that references a pack size row, so nothing needs to survive it.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/PackSizeId' }]
      responses:
        '200':
