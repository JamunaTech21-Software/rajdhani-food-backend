  /admin/banners:
    get:
      tags: [Admin]
      summary: List banners
      description: |
        Paginated, ordered by `placement` then `sort_order`. §7.3's "Banners
        and page content" row is CONTENT — Sales holds no access at all here
        (unlike PRODUCTS, where Sales gets READ); there is no admin-facing
        read path for Sales on this resource.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: placement
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BannerPlacementEnum' }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
      responses:
        '200':
          description: A page of banners.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Banner' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Create a banner
      description: "Defaults to `status: PUBLISHED` — see `BannerInput`'s description for why that default differs from products and categories."
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BannerInput' }
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Banner' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/banners/reorder:
    patch:
      tags: [Admin]
      summary: Apply a new display order within one placement
      description: |
        Send `placement` and every id in that placement's slider, in the
        order it should display. Positions are assigned `1..n`. An id that
        does not exist, is deleted, or belongs to a *different* placement is
        reported as not applied — the same "apply what's valid, name what
        isn't" behaviour as `/admin/categories/reorder`, but scoped: this
        never reassigns a position to a banner outside the placement named
        in the request, even if the id itself is otherwise valid.

        Reflected in `GET /public/banners?placement=...` on the very next
        request — no deploy needed (doc §10.1's DoD).
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placement, ids]
              properties:
                placement: { $ref: '#/components/schemas/BannerPlacementEnum' }
                ids:
                  type: array
                  items: { $ref: '#/components/schemas/Ulid' }
                  minItems: 1
      responses:
        '200':
          description: Reordered.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reordered: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: A malformed id, a repeated id, or an id that does not belong to this placement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }

