                      data:
                        type: object
                        properties:
                          updated: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Some ids do not match an existing review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }

  /admin/reviews/bulk-reject:
    patch:
      tags: [Admin]
      summary: Reject several reviews at once
      description: Same "apply what you can" contract as `/admin/reviews/bulk-approve`, with one shared `reason` applied to every id.
