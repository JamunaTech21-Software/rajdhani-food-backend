openapi: 3.1.0

# Maintained by hand, not generated.
#
# There is no swagger-jsdoc equivalent under PHP without pulling in an
# annotation library and a build step, and this project deploys by uploading
# files to shared hosting (doc §16). A hand-written file is the honest trade —
# and a hand-written file drifts, so `php bin/openapi.php check` compares this
# document against the live routing table and CI fails the build on any
# disagreement in either direction. Adding a route without documenting it, or
# documenting one that does not exist, both break the build.

info:
  title: Rajdhani Tea Platform API
  version: 1.0.0
  summary: Backend REST API for rajdhanifood.com and its admin dashboard.
  description: |
    One site, two audiences.

    **Authentication is two separate systems** sharing one backend (§7). Customers
    sign in with Google only; admins with email and password, and are created by
    invitation — there is no admin self-registration. The two are kept apart by
    the `aud` claim inside the access token, not by which route is called, so an
    admin token on a customer route is refused and the reverse is refused too.

    **Tokens.** The short-lived access token goes in `Authorization: Bearer …`
    and is held in memory by the client — never in `localStorage`. The refresh
    token is **not in the response body**: it is set as an `HttpOnly` cookie
    scoped to `/api/v1/auth`, so script cannot read it. Every browser call to a
    refresh or logout endpoint must therefore send credentials:

    ```js
    fetch(url, { credentials: 'include' })
    ```

    **Refresh tokens are single-use.** Each refresh spends the presented token
    and issues a new one in the same family. Presenting a spent token means two
    parties hold it, so the entire family is revoked and both are forced back to
    a full sign-in. That is breach detection working, not a bug.

    **Every response uses one of two envelopes** (§9.1) — see the `Envelope`
    schemas. Clients should switch on `error.code`, never on `error.message`.

  contact:
    name: Jamuna Tech
  license:
    name: Proprietary

servers:
  - url: https://api.rajdhanifood.com/api/v1
    description: Production
  - url: http://127.0.0.1:8000/api/v1
    description: Local development

tags:
  - name: Health
    description: Liveness and dependency probes. No authentication, and exempt from rate limiting (§16.5).
  - name: Docs
    description: |
      This reference. Open outside production; in production it needs
      `?token=` matching `DOCS_TOKEN`, and returns 404 without it — an
      unauthenticated caller should not learn the endpoint exists.
  - name: Admin auth
    description: Email and password, argon2id. Accounts are created by invitation (§7.2).
  - name: Customer auth
    description: Google Identity Services only. No password, no registration endpoint (§7.1).
  - name: Public
    description: Unauthenticated site content. No brand header — the API serves one site (§6).
  - name: Admin
    description: Dashboard endpoints, gated by the §7.3 role matrix.

security: []

paths:

  # ── Health ────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      summary: Liveness
      description: Answers whenever PHP is executing. Does not touch the database.
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, const: ok }
                          service: { type: string, example: rajdhani-api  }
                          time: { type: string, format: date-time }

  /health/db:
    get:
      tags: [Health]
      summary: Database reachability
      description: |
        **503, not 500,** when the database is unreachable. The service is up and its
        dependency is not, and load balancers and uptime monitors treat those
        differently.
      security: []
      responses:
        '200':
          description: The database answered.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, const: ok }
                          database: { type: string, const: reachable }
                          time: { type: string, format: date-time }
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }

  # ── Documentation ─────────────────────────────────────────────────────────

  /docs:
    get:
      tags: [Docs]
      summary: This reference, rendered
      description: Returns HTML, not the section 9.1 envelope.
      security: []
      parameters:
        - $ref: '#/components/parameters/DocsToken'
      responses:
        '200':
          description: The rendered reference.
          content:
            text/html:
              schema: { type: string }
        '404':
          description: |
            In production without a valid `token`. Deliberately 404 rather than
            401 — a 401 would confirm that a docs endpoint is here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }

  /docs/openapi.yaml:
    get:
      tags: [Docs]
      summary: This specification, raw
      description: |
        Import straight into Postman, Insomnia or an OpenAPI client generator.
        Served as YAML rather than JSON because every consumer reads YAML and
        converting would mean parsing it at request time with a library that is
        deliberately dev-only.
      security: []
      parameters:
        - $ref: '#/components/parameters/DocsToken'
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
        '404':
          description: In production without a valid `token`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }

  # ── Admin authentication ──────────────────────────────────────────────────

  /auth/admin/login:
    post:
      tags: [Admin auth]
      summary: Sign in
      description: |
        Rate limited: five failures per email per fifteen minutes, then a
        thirty-minute lockout (§7.2). While locked, even the correct password
        returns `429` — that is how a client tells "wait" from "wrong".

        **Every failure returns the same message.** Wrong password, no such
        account, deactivated, invitation never accepted: one answer, so the
        endpoint cannot be used to discover which addresses are registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Signed in. Sets the refresh cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/admin/refresh:
    post:
      tags: [Admin auth]
      summary: Rotate the session
      description: |
        Requires the refresh cookie, so the browser must send credentials.
        The presented token is spent and a replacement issued in the same family.
        A deactivated admin fails here — which is what bounds their access to one
        access-token lifetime.
      security: [{ adminRefreshCookie: [] }]
      responses:
        '200':
          description: Rotated. Sets a new refresh cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminSession' }
        '401':
          description: |
            No valid session. Also returned when a **spent** token is replayed, in
            which case the whole token family has just been revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }

  /auth/admin/logout:
    post:
      tags: [Admin auth]
      summary: Sign out
      description: |
        Deliberately unauthenticated. A session whose access token has already
        expired must still be able to end itself, or a tab left open overnight
        cannot be logged out. Clears the cookie whether or not a token was found.
      security: [{ adminRefreshCookie: [] }]
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          logged_out: { type: boolean, const: true }

  /auth/admin/me:
    get:
      tags: [Admin auth]
      summary: Current admin
      description: |
        Includes `permissions` — this admin's row of the §7.3 matrix, served from
        the same table the middleware enforces. Use it to hide navigation the
        caller cannot use. **It is a convenience for the UI and never a
        substitute for the server-side check.**
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: The signed-in admin.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Admin auth]
      summary: Update own profile
      description: |
        Name, phone and avatar only. Role, email and active status are on the same
        row and none of them may be changed by their owner — an admin who could
        edit their own role would need no other escalation. Unknown fields are
        ignored rather than rejected.
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                phone: { type: [string, 'null'], maxLength: 32 }
                avatar_id: { type: [string, 'null'], description: A media asset id (ULID).  }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/admin/change-password:
    post:
      tags: [Admin auth]
      summary: Change own password
      description: |
        **Ends every session, including this one** (§7.2). A password change is the
        response to a suspected compromise, so leaving other devices signed in
        would defeat it. The client must sign in again — `reauthentication_required`
        says so explicitly rather than letting the next call 401 silently.
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200':
          description: Changed. Every session is now revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          password_changed: { type: boolean, const: true }
                          reauthentication_required: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: The current password was wrong, or the new one fails policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }

  /auth/admin/forgot-password:
    post:
      tags: [Admin auth]
      summary: Request a password reset
      description: |
        **Always succeeds**, whether or not the address belongs to an account.
        Answering differently would make this an account-existence oracle that
        needs no credentials at all. The reset link is emailed; the token is never
        returned in the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Accepted. Says nothing about whether the account exists.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/admin/reset-password:
    post:
      tags: [Admin auth]
      summary: Consume a reset token
      description: Single use, and revokes every existing session for that admin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 64, maxLength: 64 }
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200':
          description: Password reset.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          password_reset: { type: boolean, const: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/admin/invite/{token}:
    get:
      tags: [Admin auth]
      summary: Validate an invitation
      description: |
        Lets the set-password screen greet the invitee and check the link before
        asking for a password it might then have to discard. Returns only name,
        email and role.
      security: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: The invitation is valid and unclaimed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          name: { type: string }
                          email: { type: string, format: email }
                          role: { $ref: '#/components/schemas/AdminRole' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/admin/invite/{token}/accept:
    post:
      tags: [Admin auth]
      summary: Accept an invitation
      description: |
        Sets the password and signs the invitee in immediately — they have just
        proved possession of the emailed token and chosen a password, and a second
        login step would add nothing.

        Until this is called the account has **no password at all** and cannot be
        logged into. That is how the seeded Super Admin starts (§7.2).
      security: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200':
          description: Accepted and signed in. Sets the refresh cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ── Customer authentication ───────────────────────────────────────────────

  /auth/customer/google:
    post:
      tags: [Customer auth]
      summary: Sign in with Google
      description: |
        Send the ID token Google Identity Services handed the browser. Either field
        name works — `credential` is what GIS calls it, `id_token` is what most
        examples call it.

        The token is verified server-side against Google's published keys:
        signature, algorithm, issuer, **audience** (it must have been minted for
        *this* application), expiry, and `email_verified`. An account is created on
        first sign-in; there is no separate registration endpoint.

        `is_new` is true only on the sign-in that created the account, so the
        front-end can show a welcome once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credential: { type: string, description: The Google ID token (JWT).  }
                id_token: { type: string, description: Accepted as an alias for `credential`.  }
      responses:
        '200':
          description: Signed in. Sets the refresh cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          customer: { $ref: '#/components/schemas/CustomerProfile' }
                          tokens: { $ref: '#/components/schemas/Tokens' }
                          is_new: { type: boolean }
        '401':
          description: The Google token failed verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '403':
          description: The account is suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/customer/refresh:
    post:
      tags: [Customer auth]
      summary: Rotate the session
      security: [{ customerRefreshCookie: [] }]
      responses:
        '200':
          description: Rotated. Sets a new refresh cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          customer: { $ref: '#/components/schemas/CustomerProfile' }
                          tokens: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/customer/logout:
    post:
      tags: [Customer auth]
      summary: Sign out
      security: [{ customerRefreshCookie: [] }]
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          logged_out: { type: boolean, const: true }

  /auth/customer/me:
    get:
      tags: [Customer auth]
      summary: Current customer
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: The signed-in customer.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Customer auth]
      summary: Update own profile
      description: |
        Phone, city and company only — the fields that pre-fill an enquiry form.
        Not name or avatar: Google owns those and overwrites them at the next
        sign-in. Not email: it is the identity key. Send `""` to clear a field.
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: [string, 'null'], maxLength: 32 }
                city: { type: [string, 'null'], maxLength: 128 }
                company_name: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Customer auth]
      summary: Delete the account
      description: |
        **Irreversible, and takes the customer's personal data with it** — wishlist
        items, sessions, and their published product reviews. A deletion that left
        public content attributed to the person would not be a deletion. Warn
        clearly before calling this.
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ── Public ────────────────────────────────────────────────────────────────

  /public/layout:
    get:
      tags: [Public]
      summary: Everything the front-end boots from
      description: |
        Site identity, theme colours, logos, contact block, map, footer copy,
        grouped navigation, social links and newsletter visibility — in one call,
        because the header cannot be painted until all of it has arrived.

        **No authentication, no header, no query string.** There is no `X-Brand`:
        the API serves one site (§6).

        The theme colours are data, not constants — the client changes them in the
        admin panel and this endpoint reflects it on the very next request (§18.2).
        Apply them as CSS custom properties rather than hard-coding any value.
      security: []
      responses:
        '200':
          description: The composed layout.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Layout' }

  /public/home:
    get:
      tags: [Public]
      summary: The composed home page payload
      description: |
        Banners, featured products, stats, news and testimonials in one call
        (§9.3, §14.1) — narrower than §10.1's full page description, which
        also lists a feature-item strip and a welcome page block; neither
        has a public read path yet (RTPP-24 deferred that exposure).

        Cached for 120 seconds (doc §14.1's optional aggregate cache,
        RTPP-36) — Redis if `REDIS_URL` is configured and the extension is
        loaded, a local file otherwise; either way `POST /admin/cache/purge`
        forgets it immediately after a publish.
      security: []
      responses:
        '200':
          description: The composed home payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HomePayload' }

  /public/categories:
    get:
      tags: [Public]
      summary: Active categories, with product counts
      description: |
        Feeds the sticky filter bar (§10.2) and the header Products dropdown
        (§10.5). No authentication, no query parameters.

        A category with zero published products is still returned, with
        `product_count: 0` — it is a real category waiting for its first
        product, not a reason to hide it from the filter bar.
      security: []
      responses:
        '200':
          description: The active category list, in display order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicCategory' }

  /public/banners:
    get:
      tags: [Public]
      summary: Active, in-window banners for one placement
      description: |
        Drives a hero slider or a single promo slot, depending on
        `placement`. Never returns a `DRAFT` or `ARCHIVED` banner, and never
        one outside its own `starts_at`/`ends_at` window — a banner scheduled
        for tomorrow does not appear today, and one that ended yesterday
        stops appearing the moment it does, with no deploy needed (doc
        §10.1's DoD). Ordered by `sort_order`.
      security: []
      parameters:
        - $ref: '#/components/parameters/BannerPlacement'
      responses:
        '200':
          description: The active banners for this placement, in slider order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicBanner' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /public/gallery/categories:
    get:
      tags: [Public]
      summary: The gallery tab bar
      description: Active categories only, each with a live count of its active images (doc §9.5).
      security: []
      responses:
        '200':
          description: The gallery categories.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicGalleryCategory' }

  /public/gallery:
    get:
      tags: [Public]
      summary: The gallery image grid
      description: |
        Paginated, ordered by the category's own `sort_order` then the
        image's (doc §9.5) — an "All" view reads as the tab bar's order, not
        upload order. `category` is a slug, not an id, and is optional; a
        slug matching nothing returns an empty page rather than a `404`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: category
          in: query
          required: false
          description: A gallery category's `slug`.
          schema: { type: string }
      responses:
        '200':
          description: A page of gallery images.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicGalleryImage' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }

  /public/news:
    get:
      tags: [Public]
      summary: Published news posts, paginated
      description: |
        Visible posts only — `status = PUBLISHED` and `published_at` not in
        the future (doc §9.5). Newest first. Optional `tag` filter.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: tag
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: A page of news cards.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicNewsCard' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }

  /public/news/featured:
    get:
      tags: [Public]
      summary: The home "Latest Updates" band
      description: |
        The three most recent visible posts (doc §9.5, §10.1). `is_featured`
        has no bearing here — see `NewsPost`'s description.
      security: []
      responses:
        '200':
          description: Up to three news cards.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        maxItems: 3
                        items: { $ref: '#/components/schemas/PublicNewsCard' }

  /public/news/{slug}:
    get:
      tags: [Public]
      summary: Full article, with prev/next navigation
      description: |
        Increments `view_count` on every call (doc §9.5). A slug that exists
        but is not currently visible (`DRAFT`, `ARCHIVED`, or scheduled for
        later) `404`s exactly like one that never existed.
      security: []
      parameters:
        - $ref: '#/components/parameters/NewsSlug'
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicNewsPost' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/products:
    get:
      tags: [Public]
      summary: The public product catalogue — listing and filtering
      description: |
        `PUBLISHED`, non-deleted products only, ordered `sort_order, name`
        unless `sort` says otherwise. Every filter is a plain query parameter
        so the customer site can sync the whole filter state to the URL and
        get a shareable, back-button-safe listing (doc §10.2) — an
        unrecognised `sort` value silently falls back to the default rather
        than `422`ing the whole page over a stale query string.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: category
          in: query
          required: false
          description: A category's `slug`, not its id.
          schema: { type: string }
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match on the product name.
          schema: { type: string }
        - name: featured
          in: query
          required: false
          description: 'When `true`, only products with `is_featured: true`.'
          schema: { type: boolean }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [newest, name, price_asc, price_desc, rating], default: newest }
      responses:
        '200':
          description: A page of product cards.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProductCard' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }

  /public/products/{slug}:
    get:
      tags: [Public]
      summary: Full product detail
      description: |
        Everything the detail page needs in one payload: tab content, pack
        sizes, highlights, images, the rating summary, and SEO meta (doc
        §10.2). A `DRAFT` or `ARCHIVED` product's slug 404s exactly like a
        slug that never existed — the public API never reveals which.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicProduct' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/products/{slug}/related:
    get:
      tags: [Public]
      summary: Related products, by category
      description: |
        Other `PUBLISHED` products sharing this one's category, excluding
        itself, ordered `sort_order, name`. Same `404` rule as the detail
        route for an unpublished or unknown `slug` (a related-products strip
        cannot exist for a product the customer site could never have
        reached in the first place).
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
        - name: limit
          in: query
          required: false
          description: Capped server-side; this is a strip, not a paginated listing.
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: Related product cards.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProductCard' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/products/{slug}/reviews:
    get:
      tags: [Public]
      summary: Approved reviews for one product
      description: |
        Approved reviews only, newest first (doc §9.4). `meta` also carries
        the computed aggregates the ticket names: `rating_average`,
        `rating_count`, and `distribution` (a count per star rating, 1
        through 5, zero-filled) — the numbers the reviews tab renders
        alongside the list itself (doc §10.2).
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductSlugForReviews'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of approved reviews, plus the product's rating aggregates.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicReview' }
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/PaginationMeta'
                          - type: object
                            properties:
                              rating_average: { type: number }
                              rating_count: { type: integer }
                              distribution:
                                type: object
                                additionalProperties: { type: integer }
                                example: { '1': 0, '2': 1, '3': 2, '4': 5, '5': 12 }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Public]
      summary: Submit a review
      description: |
        **Customer token required.** Always creates a `PENDING` review — the
        DoD's "invisible until approved" (doc §9.4, §18.6). One review per
        customer per product (`uq_reviews_product_customer`); a second
        submission against the same product is rejected with `409` — edit
        the existing one instead (`PATCH /public/my/reviews/{id}`).

        Rate-limited and human-verified like the other four public forms
        (doc §14.2; RTPP-34), even though this one also requires a customer
        token: send `recaptcha_token` (a reCAPTCHA v3 token for the
        "review" action) and leave `website` (a honeypot) empty. Neither is
        part of `ReviewInput` below since that schema is shared with the
        unprotected `PATCH /public/my/reviews/{id}`.
      security: [{ customerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductSlugForReviews'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: Created, `PENDING`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OwnReview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already reviewed this product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /public/my/reviews:
    get:
      tags: [Public]
      summary: Own review history
      description: All of the caller's reviews, every status, newest first (doc §9.7).
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: The caller's reviews.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OwnReview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /public/my/reviews/{id}:
    patch:
      tags: [Public]
      summary: Edit own review
      description: |
        Resets `status` to `PENDING` unconditionally (doc §9.7) — an edited
        review is content an admin has not seen yet. A review that was
        `APPROVED` is removed from the product's rating aggregate the moment
        this call lands, recomputed in the same transaction as the edit.
      security: [{ customerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: Updated, now `PENDING`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OwnReview' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: No such review, or it belongs to a different customer — the two are indistinguishable on purpose.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Public]
      summary: Delete own review
      description: Idempotent. Recomputes the product's rating aggregate if the review was `APPROVED` (doc §9.7).
      security: [{ customerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Deleted (or already gone).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { type: object, properties: { deleted: { type: boolean, const: true } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /public/wishlist:
    get:
      tags: [Public]
      summary: The caller's wishlist
      description: |
        Server-persisted, so it follows the customer across devices (doc
        §9.7, §18.6). Newest-added first. A wishlisted product since
        unpublished or soft-deleted from the catalogue is silently absent —
        never an error, never a gap the client has to handle specially.
      security: [{ customerBearer: [] }]
      responses:
        '200':
          description: The wishlist.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/ProductCard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Public]
      summary: Add a product to the wishlist
      description: |
        Idempotent — adding a product already on the wishlist is a no-op,
        not an error. Only a currently `PUBLISHED` product may be added.
        Returns the fresh full wishlist, the same contract every mutation
        here shares (doc §8.6).
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WishlistAddInput' }
      responses:
        '200':
          description: The wishlist, including the newly added product.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/ProductCard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /public/wishlist/merge:
    post:
      tags: [Public]
      summary: Merge a guest wishlist into the account
      description: |
        Called once at login with whatever the browser held locally as a
        guest (doc §8.6). Upserts each valid, currently published id and
        returns the merged server list.
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WishlistMergeInput' }
      responses:
        '200':
          description: The merged wishlist.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/ProductCard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /public/wishlist/{productId}:
    delete:
      tags: [Public]
      summary: Remove a product from the wishlist
      description: Idempotent — removing a product not on the wishlist is not an error. Returns the fresh full wishlist.
      security: [{ customerBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/WishlistProductId'
      responses:
        '200':
          description: The wishlist, with the product removed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/ProductCard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /public/enquiries:
    post:
      tags: [Public]
      summary: Submit a product enquiry
      description: |
        The platform's primary conversion path — there is no cart or
        checkout (doc §2, §9.6). Rate limited to 5 per hour per IP
        (§14.2). An optional customer token attributes the lead to an
        account without requiring one. Returns only a reference number;
        nothing else is exposed on this unauthenticated endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnquirySubmission' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EnquirySubmissionResult' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/locations/districts:
    get:
      tags: [Public]
      summary: List all districts
      description: The 64 districts of Bangladesh (doc §9.6, §10.3; RTPP-30), for the dealer form's district dropdown. Alphabetical, unpaginated.
      security: []
      responses:
        '200':
          description: All districts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/District' }

  /public/locations/districts/{id}/upazilas:
    get:
      tags: [Public]
      summary: List a district's upazilas
      description: The dependent upazila dropdown (doc §9.6, §10.3). A district id that does not exist is `404`, not an empty list.
      security: []
      parameters:
        - $ref: '#/components/parameters/DistrictId'
      responses:
        '200':
          description: The district's upazilas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Upazila' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/dealer-applications:
    post:
      tags: [Public]
      summary: Submit a dealer / distributor application
      description: |
        The platform's second lead-capture form (doc §2, §9.6, §10.3). Rate
        limited to 5 per hour per IP (§14.2), a separate budget from
        `/public/enquiries`. Returns the Application ID, submission
        timestamp, and expected response window the success modal displays
        (§10.3) — nothing else, on a public unauthenticated endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealerApplicationSubmission' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DealerApplicationSubmissionResult' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/contact:
    post:
      tags: [Public]
      summary: Submit the contact form
      description: |
        The platform's simplest lead-capture form (doc §9.6, §11; RTPP-31) —
        no reference number, no assignee. Rate limited to 5 per hour per IP
        (§14.2), a separate budget from the other three public forms.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMessageSubmission' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { type: object, properties: { received: { type: boolean, const: true } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/newsletter/subscribe:
    post:
      tags: [Public]
      summary: Subscribe to the newsletter
      description: |
        Rate limited to 5 per hour per IP (§14.2), its own separate budget.
        Re-subscribing an address that is already active is a silent
        no-op — no duplicate row, no error — and one that had previously
        unsubscribed is reactivated in place, keeping its existing
        unsubscribe token. See `NewsletterService::subscribe()`'s class doc.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsletterSubscribeInput' }
      responses:
        '200':
          description: Subscribed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NewsletterSubscriptionResult' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/newsletter/unsubscribe/{token}:
    get:
      tags: [Public]
      summary: One-click unsubscribe
      description: |
        No authentication — the 64-character random token is what makes the
        link "not guessable" (the DoD's own wording), not a signed-in
        session. Not rate limited: a `GET` link a visitor clicks once is not
        a form submission (`ThrottleForm` itself skips `GET`). Idempotent —
        unsubscribing an already-unsubscribed token still succeeds.
      security: []
      parameters:
        - $ref: '#/components/parameters/UnsubscribeToken'
      responses:
        '200':
          description: Unsubscribed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/NewsletterSubscriptionResult' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/downloads/{key}:
    get:
      tags: [Public]
      summary: Resolve a brochure or catalogue download
      description: |
        Resolved by a stable `key` (doc §9.6, §10.3; RTPP-32), not a ULID —
        the front-end's download button is built against a known key like
        `dealer_brochure`. Increments the download counter. Never requires
        an email address first — doc §19's open item on this was resolved
        2026-09-13 ("Open — no email required"); `requires_email` is stored
        for a future ticket but not enforced here. An inactive or unknown
        key is `404`.
      security: []
      parameters:
        - $ref: '#/components/parameters/DownloadKey'
      responses:
        '200':
          description: The file URL.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DownloadResolution' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Admin ─────────────────────────────────────────────────────────────────

  /admin/categories:
    get:
      tags: [Admin]
      summary: List categories
      description: |
        Paginated, newest sort order first. Visible to every role — Sales holds
        only READ on `products` (§7.3), so the list is visible in the
        dashboard even though the mutating routes below are not.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          required: false
          description: Case-insensitive substring match on the category name.
          schema: { type: string }
      responses:
        '200':
          description: A page of categories.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Admin]
      summary: Create a category
      description: |
        Only `name` is required. An explicit `slug` is honoured exactly — reject
        with `409` if it collides, never silently renamed — because an admin who
        typed a specific slug is choosing a URL, not making a suggestion. Omit
        `slug` and one is derived from `name`, auto-suffixed (`-2`, `-3`, …) on
        collision, since nobody chose a specific value to be surprised about.

        `slug` is unique **globally** — there is no brand to scope it by (§6).
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The requested slug is already in use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/categories/reorder:
    patch:
      tags: [Admin]
      summary: Apply a new display order
      description: |
        Send every id in the order it should display; positions are assigned
        `1..n` from that order. If any id does not match an existing category,
        the ones that do are still applied — a stale id (a category deleted in
        another tab) should not block reordering the rest — and the response
        names what was missing.

        Reflected in `GET /public/categories` on the very next request.
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { $ref: '#/components/schemas/Ulid' }
                  minItems: 1
      responses:
        '200':
          description: Reordered.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reordered: { type: integer, description: How many ids were applied. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: A malformed id, a repeated id, or an id with no matching category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }

  /admin/categories/{id}:
    get:
      tags: [Admin]
      summary: Read one category
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      summary: Update a category
      description: |
        Send only the fields that are changing. Renaming `slug` follows the
        same rule as create: an exact match is attempted, `409` on collision,
        never a silent rename — including against the category's own current
        slug, which is never a collision with itself.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The requested slug is already in use by a different category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Delete a category
      description: |
        Soft delete — the row is kept and `deleted_at` is set, never a hard
        `DELETE`, because `products.category_id` has a plain foreign key into
        this table with no cascade. A category's products are completely
        unaffected by deleting it. Idempotent: deleting an already-deleted or
        never-existing id still returns `200`.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Deleted (or already was).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/products:
    get:
      tags: [Admin]
      summary: List products
      description: Paginated; filter by `status`, `category_id`, or `search` (name substring).
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        - name: category_id
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Ulid' }
      responses:
        '200':
          description: A page of products (summary shape — see `Product` for the full one returned by the other routes here).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProductSummary' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Admin]
      summary: Create a product
      description: |
        Only `name` and `category_id` are required. `pack_sizes`, `highlights`
        and `images` may be included inline and are written in the **same
        transaction** as the product row — the whole call succeeds or none of
        it is saved. This is how the tabbed admin form is expected to submit:
        the current contents of every tab, in one request.

        Rich text fields (`description`, `ingredients`, `nutrition_info`,
        `brewing_guide`, `packaging_info`) are sanitised server-side before
        storage; anything not on a small fixed allowlist of tags is stripped,
        not escaped. An empty tab is stored and returned as `null`, not `""`,
        so the front-end can hide it rather than render a blank section.

        `slug` follows the same rule as categories: given explicitly, it is
        exact-or-`409`; omitted, it is derived from `name` and auto-suffixed
        on collision.
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Created, with its children.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The slug, or a pack size's SKU, is already in use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/products/reorder:
    patch:
      tags: [Admin]
      summary: Apply a new display order
      description: Same contract as `/admin/categories/reorder` — see there for the missing-id behaviour.
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { $ref: '#/components/schemas/Ulid' }, minItems: 1 }
