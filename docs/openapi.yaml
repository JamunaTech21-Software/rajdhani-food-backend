  /admin/media/signature:
    post:
      tags: [Admin]
      summary: Get signed parameters for a direct-to-Cloudinary upload
      description: |
        The file never transits this API (doc §12) — shared hosting caps
        `upload_max_filesize` and `max_execution_time`, and this endpoint is
        what keeps a large upload off both. The browser uploads straight to
        Cloudinary with the returned parameters, then calls
        `POST /admin/media` with what Cloudinary reports back.

        Gated at the same threshold as `POST /admin/media`: an Editor holds
        only `OWN` on `media` in §7.3 (Super Admin holds `WRITE`), and `OWN`
        is what a route needs to admit "may create an asset at all" — see
        the route registration comment in `routes/admin.php`.
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaSignatureInput' }
      responses:
        '200':
          description: Signed upload parameters.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MediaSignature' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/media:
    get:
      tags: [Admin]
      summary: The Media Library grid
      description: |
        Paginated, newest first (doc §11, §12; RTPP-91). Filterable by
        `folder` — an exact match on the `rajdhani/{resource}` convention,
        since assets are never nested deeper than that one segment — and by
        `type`.

        `READ`, not `own()`: Sales holds no `media` row at all in §7.3
        (`NONE`), so `read()` already excludes Sales while admitting both a
        Super Admin (`WRITE` satisfies `READ`) and an Editor (`OWN`
        satisfies `READ`) — there is no "someone else's row" to hide on a
        list, only on a mutation.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: folder
          in: query
          required: false
          description: Exact match, e.g. `rajdhani/products`.
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [IMAGE, VIDEO, DOCUMENT] }
      responses:
        '200':
          description: A page of media assets.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MediaAsset' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Admin]
      summary: Register an asset after a direct Cloudinary upload
      description: |
        Records what Cloudinary reports after the upload
        `POST /admin/media/signature` authorised — this call is the "server-
        side" half of doc §12's "validated by signature and MIME type server-
        side at registration":

        * `public_id`/`version`/`signature` are checked against this
          account's own signing secret before anything else in the body is
          trusted — a forged or mismatched signature is `400 UPLOAD_FAILED`.
        * `public_id` must fall under the configured folder prefix, or the
          call is refused the same way.
        * `format` is checked against the MIME allowlist for `resource_type`
          (§12: images ≤ 5 MB as JPG/PNG/WebP/SVG; documents ≤ 20 MB, PDF
          only), and `bytes` against the matching size limit — both `400
          UPLOAD_FAILED` on violation.
        * The same `public_id` cannot be registered twice (`409`).
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaRegisterInput' }
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MediaAsset' }
        '400':
          description: The signature could not be verified, the asset is outside the expected folder, or it fails the size/type limit for its kind.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: This `public_id` has already been registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/media/{id}:
    get:
      tags: [Admin]
      summary: Read one asset, with where it is used
      description: |
        Same `MediaAsset` shape as the list, plus `usage` — every table that
        currently references this asset (doc §11, §12; RTPP-91), the same
        data `DELETE`'s `409 CONFLICT` names, offered here proactively so
        the dashboard can show it before an editor ever attempts to delete.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: The asset.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MediaAssetWithUsage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      summary: Edit alt text and/or caption
      description: |
        Alt text and caption only (doc §11, §12; RTPP-91) — every other
        field describes what Cloudinary actually holds (`public_id`,
        `bytes`, dimensions, …) and re-uploading is the only honest way to
        change that.

        Gated at the same `own()` threshold as `DELETE` on this route: an
        Editor may edit only media they themselves uploaded (`403` on
        someone else's), a Super Admin may edit any asset.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaUpdateInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MediaAsset' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Not this caller's own upload, and they hold only OWN (not WRITE) on media.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin]
      summary: Delete an asset, after checking every table that could reference it
      description: |
        Idempotent, like every other delete in this codebase — an id that
        does not exist has already reached the end state this call wants.

        Before anything is removed, every table with a foreign key onto
        `media_assets.id` is checked (doc §12's corrected RTPP-22 scope: the
        full list is in `MediaRepository::REFERENCE_CHECKS`, not fixed to
        what shipped first). If any table references this asset, the call is
        refused with `409` and `error.details` names each one — the field
        names are the referencing table names, so a caller can show "in use
        by: categories, banners" rather than a bare refusal.

        Only once nothing references it does the delete proceed: the
        registry row is removed first, inside a transaction, and Cloudinary's
        own asset is deleted second — in that order specifically so a
        Cloudinary failure rolls the row back rather than leaving a registry
        entry pointing at an asset Cloudinary already has no record of.

        Gated at the same `own()` threshold as the other `/admin/media`
        routes, and this is the route that threshold was written for: an
        Editor may delete only media they themselves uploaded (`403` on
        someone else's), a Super Admin may delete any asset.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Deleted (or already gone).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { type: object, properties: { deleted: { type: boolean, const: true } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Not this caller's own upload, and they hold only OWN (not WRITE) on media.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }
        '409':
          description: Still referenced by at least one other table; `error.details` names which.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeError' }

  /admin/site-profile:
    get:
      tags: [Admin]
      summary: Read the site profile
      description: |
        The same payload as `/public/layout`, gated. Settings are a Super-Admin
        capability in §7.3, so this read is narrower than the public one — what is
        protected is the settings screen, not the content.
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: The site profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Layout' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Admin]
      summary: Update the site profile
      description: |
        Super Admin only. Send only the fields you are changing; `""` clears an
        optional one. Colours must be hex (`#RGB`, `#RRGGBB` or `#RRGGBBAA`) —
        an invalid colour reaches the browser as a CSS custom property and fails
        *silently* there, so it is rejected here instead.
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteProfileUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SiteProfile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Query the audit trail
      description: |
        Every admin mutation writes exactly one row here (doc §3.1, §13;
        RTPP-35) — `AuditLog` middleware, not a controller, so no route can
        forget to call it. Super Admin only (§7.3): the row is READ, never
        WRITE, because a role that could edit its own trail would make the
        trail worthless as evidence.

        `before`/`after` hold only the fields that actually changed between
        the two reads the middleware took, not the whole row each time — a
        metadata-only edit on a long news body does not copy that body into
        this table. A create has `before: null`; a delete has `after: null`.
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: actor
          in: query
          required: false
          description: Filter to one admin's id.
          schema: { type: string }
        - name: action
          in: query
          required: false
          description: Exact match, e.g. `banner.update`.
          schema: { type: string }
        - name: resource
          in: query
          required: false
          description: Exact match on entity type, e.g. `Banner`.
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: 'Inclusive. `YYYY-MM-DD` or a full ISO 8601 timestamp.'
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: 'Inclusive — a bare `YYYY-MM-DD` covers the whole day. `YYYY-MM-DD` or a full ISO 8601 timestamp.'
          schema: { type: string }
      responses:
        '200':
          description: A page of audit log entries, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLogEntry' }
                      meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/dashboard/summary:
    get:
      tags: [Admin]
      summary: Dashboard overview
      description: |
        Counts of new enquiries, new applications, unread messages, pending
        reviews and subscribers; a 30-day day-by-day submissions chart; and
        the most recent leads across enquiries, applications and messages
        (doc §9, §11; RTPP-36).

        Every role holds `DASHBOARD` READ (§7.3), but Sales is scoped to
        "leads only": `pending_reviews` is omitted from the counts object
        entirely for a Sales admin, who holds no `REVIEWS` capability at all.
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: The dashboard summary.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/cache/purge:
    post:
      tags: [Admin]
      summary: Purge the aggregate cache and regenerate the sitemap
      description: |
        "Called on publish" (doc §9): forgets the cached `/public/home`
        payload and regenerates `public/sitemap.xml` from currently
        published content (§14.3; RTPP-36). `/public/layout` is untouched —
        it belongs to RTPP-14 and is never cached (see that endpoint's own
        description).

        Editor+ (doc §9's route table) — a `CACHE` capability, `WRITE` for
        Editor and Super Admin, none for Sales, added to §7.3 alongside
        this ticket.
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: Purged.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeSuccess'
                  - type: object
                    properties:
                      data: { type: object, properties: { purged: { type: boolean, const: true } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:

  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Admin access token, 20 minutes. Its `aud` claim is `admin`, and a customer
        token is refused on these routes even though both are signed with the same
        key. Hold it in memory, never in `localStorage`.
    customerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer access token, 15 minutes. Its `aud` claim is `customer`.
    adminRefreshCookie:
      type: apiKey
      in: cookie
      name: rajdhani_admin_refresh
      description: |
        Set automatically on sign-in; `HttpOnly`, so script cannot read it. Send
        `credentials: 'include'` or it will not travel cross-origin.
    customerRefreshCookie:
      type: apiKey
      in: cookie
      name: rajdhani_customer_refresh
      description: As above, for the customer audience.

  headers:
    RefreshCookie:
      description: |
        `HttpOnly; Secure; SameSite=None`, scoped to `/api/v1/auth`. `SameSite=None`
        requires `Secure`, which requires HTTPS — over plain `http://localhost` the
        browser silently drops it and refresh cannot be tested at all.
      schema: { type: string }

  parameters:
    DocsToken:
      name: token
      in: query
      required: false
      description: Required in production only; must match `DOCS_TOKEN`.
      schema: { type: string }
    InviteToken:
      name: token
      in: path
      required: true
      description: The single-use invitation token from the emailed link.
      schema: { type: string, minLength: 64, maxLength: 64 }
    CategoryId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      required: false
      description: Capped server-side so an uncapped page size is never an option.
      schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
    ProductId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    PackSizeId:
      name: packSizeId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    HighlightId:
      name: highlightId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    ImageId:
      name: imageId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    ProductSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    MediaId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    BannerId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    BannerPlacement:
      name: placement
      in: query
      required: true
      schema: { $ref: '#/components/schemas/BannerPlacementEnum' }
    FeatureItemId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    ProcessStepId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    StatCounterId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    CertificationId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    TestimonialId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    PageBlockId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    GalleryCategoryId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    GalleryImageId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    NewsId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    NewsSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    ProductSlugForReviews:
      name: slug
      in: path
      required: true
      description: A product's slug.
      schema: { type: string }
    ReviewId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    WishlistProductId:
      name: productId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    EnquiryId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    DistrictId:
      name: id
      in: path
      required: true
      description: A district id — the `:id` segment of `/public/locations/districts/:id/upazilas`.
      schema: { $ref: '#/components/schemas/Ulid' }
    DealerApplicationId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    ContactMessageId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    SubscriberId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    UnsubscribeToken:
      name: token
      in: path
      required: true
      description: The 64-character random token from the subscriber's unsubscribe link.
      schema: { type: string, minLength: 64, maxLength: 64 }
    MenuLinkId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    SocialLinkId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    DownloadId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    DownloadKey:
      name: key
      in: path
      required: true
      description: The download's stable key, e.g. `dealer_brochure` — not a ULID.
      schema: { type: string, maxLength: 64 }

  responses:
    Unauthenticated:
      description: Missing, malformed, expired, or minted for the other audience.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    Forbidden:
      description: Authenticated, but this role may not do this (§7.3).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    NotFound:
      description: No such resource, or the token is invalid or already used.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    ValidationError:
      description: |
        Input failed validation. `error.details` lists **every** failed rule at
        once, so a form can mark all of its fields in one pass.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }
    RateLimited:
      description: Too many requests. `Retry-After` gives the wait in seconds.
      headers:
        Retry-After:
          schema: { type: integer }
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          schema: { type: integer, description: Unix timestamp when the window resets.  }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeError' }

  schemas:

    EnvelopeSuccess:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta: { type: object, description: 'Pagination and similar, when the endpoint returns a list.' }

    EnvelopeError:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: For a human. **Never switch on this** — switch on `code`.
            details:
              type: array
              description: Present on validation failures; one entry per failed rule.
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

    ErrorCode:
      type: string
      description: The closed set from §9.1. Adding a value is a contract change.
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - UPLOAD_FAILED
        - INTERNAL_ERROR

    Ulid:
      type: string
      minLength: 26
      maxLength: 26
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: Crockford base32 ULID — sortable by creation time.

    AdminRole:
      type: string
      enum: [SUPER_ADMIN, EDITOR, SALES]

    NewPassword:
      type: string
      format: password
      minLength: 10
      description: |
        At least 10 characters with an uppercase letter, a lowercase letter, a
        digit and a symbol (§7.2). A failure returns every unmet rule at once.

    Tokens:
      type: object
      description: |
        **The refresh token is not here.** It travels only in the `HttpOnly`
        cookie — returning it in the body would hand it back to the very script
        the cookie protects it from.
      properties:
        access_token: { type: string }
        expires_in: { type: integer, description: Seconds until the access token expires.  }
        refresh_expires_at: { type: integer, description: Unix timestamp the refresh cookie expires.  }

    AdminProfile:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AdminRole' }
        phone: { type: [string, 'null'] }
        avatar_id: { type: [string, 'null'] }
        is_active: { type: boolean }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        permissions: { $ref: '#/components/schemas/Permissions' }

    Permissions:
      type: object
      description: |
        This admin's row of the §7.3 matrix. `own` appears for one cell only — an
        Editor may delete media they uploaded, not media somebody else did.
      additionalProperties:
        type: string
        enum: [none, read, own, write]
      example:
        products: write
        enquiries: read
        settings: none
        media: own

    AdminSession:
      type: object
      properties:
        admin: { $ref: '#/components/schemas/AdminProfile' }
        tokens: { $ref: '#/components/schemas/Tokens' }

    CustomerProfile:
      type: object
      description: '`google_id` is deliberately absent — the front-end has no use for it.'
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        email: { type: string, format: email }
        avatar_url: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        company_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    Image:
      type: [object, 'null']
      description: |
        Null when unset. Carries both halves on purpose: the public site needs the
        URL to render, the admin panel needs the id to change it.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        url: { type: string, format: uri }
        alt: { type: [string, 'null'] }

    Category:
      type: object
      description: The admin shape — every field, including ones the public payload omits.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        slug: { type: string, description: Globally unique — there is no brand to scope it by (§6). }
        description: { type: [string, 'null'] }
        icon_name: { type: [string, 'null'], description: Icon key for the filter bar. }
        image_id: { type: [string, 'null'] }
        sort_order: { type: integer }
        is_active: { type: boolean }
        meta_title: { type: [string, 'null'] }
        meta_description: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CategoryInput:
      type: object
      description: |
        On create, only `name` is required. On update, every field is optional —
        send just what is changing.
      properties:
        name: { type: string, maxLength: 255 }
        slug:
          type: string
          description: |
            Optional. Given exactly, or rejected with `409` if taken — never
            silently renamed. Omit to derive one from `name` instead, which
            **is** auto-suffixed on collision (see the endpoint description).
        description: { type: [string, 'null'] }
        icon_name: { type: [string, 'null'], maxLength: 64 }
        image_id: { type: [string, 'null'], description: A media asset id (ULID). }
        sort_order: { type: integer }
        is_active: { type: boolean }
        meta_title: { type: [string, 'null'], maxLength: 255 }
        meta_description: { type: [string, 'null'] }

    BannerPlacementEnum:
      type: string
      enum: [HOME_HERO, ABOUT_HERO, PRODUCTS_HERO, PRODUCT_DETAIL_HERO, QUALITY_HERO,
             DEALER_HERO, GALLERY_HERO, NEWS_HERO, CONTACT_HERO, HOME_PROMO,
             HOME_VIDEO_CARD, MID_PAGE_CTA, DEALER_CTA, SIDEBAR_AD]

    Banner:
      type: object
      description: |
        The admin shape (doc §8.7, §10.1, RTPP-23). `sort_order` is only ever
        meaningful within one `placement` — see `POST /admin/banners/reorder`.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        placement: { $ref: '#/components/schemas/BannerPlacementEnum' }
        title: { type: [string, 'null'] }
        title_highlight: { type: [string, 'null'], description: The coloured portion of a two-line headline. }
        subtitle: { type: [string, 'null'] }
        eyebrow_text: { type: [string, 'null'], example: PREMIUM QUALITY TEA }
        desktop_image_id: { type: [string, 'null'] }
        mobile_image_id: { type: [string, 'null'] }
        video_url: { type: [string, 'null'] }
        primary_cta_label: { type: [string, 'null'] }
        primary_cta_url: { type: [string, 'null'] }
        secondary_cta_label: { type: [string, 'null'] }
        secondary_cta_url: { type: [string, 'null'] }
        overlay_opacity: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        sort_order: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED], description: 'Defaults to PUBLISHED, not DRAFT — see the input schema.' }
        starts_at: { type: [string, 'null'], format: date-time, description: Null means no lower bound — active as soon as status is PUBLISHED. }
        ends_at: { type: [string, 'null'], format: date-time, description: Null means no upper bound. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BannerInput:
      type: object
      description: |
        On create, `placement` is required; everything else is optional. On
        update, send only what is changing.

        `starts_at`/`ends_at` are validated as a pair: `ends_at` must be after
        `starts_at` when both are present — on a partial update, "both" means
        whichever one this call sends plus whatever is already stored for the
        other, not just the field named in this request.
      required: [placement]
      properties:
        placement: { $ref: '#/components/schemas/BannerPlacementEnum' }
        title: { type: [string, 'null'], maxLength: 255 }
        title_highlight: { type: [string, 'null'], maxLength: 255 }
        subtitle: { type: [string, 'null'] }
        eyebrow_text: { type: [string, 'null'], maxLength: 255 }
        desktop_image_id: { type: [string, 'null'], description: A media asset id (ULID). }
        mobile_image_id: { type: [string, 'null'], description: A media asset id (ULID). }
        video_url: { type: [string, 'null'], maxLength: 512 }
        primary_cta_label: { type: [string, 'null'], maxLength: 128 }
        primary_cta_url: { type: [string, 'null'], maxLength: 255 }
        secondary_cta_label: { type: [string, 'null'], maxLength: 128 }
        secondary_cta_url: { type: [string, 'null'], maxLength: 255 }
        overlay_opacity: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        sort_order: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED], default: PUBLISHED }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }

    PublicBanner:
      type: object
      description: |
        `GET /public/banners?placement=...` (doc §10.1) — active, in-window
        banners for one placement, in slider order. Never includes a `DRAFT`
        or `ARCHIVED` banner, and never one outside its own schedule window.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        placement: { $ref: '#/components/schemas/BannerPlacementEnum' }
        title: { type: [string, 'null'] }
        title_highlight: { type: [string, 'null'] }
        subtitle: { type: [string, 'null'] }
        eyebrow_text: { type: [string, 'null'] }
        video_url: { type: [string, 'null'] }
        primary_cta_label: { type: [string, 'null'] }
        primary_cta_url: { type: [string, 'null'] }
        secondary_cta_label: { type: [string, 'null'] }
        secondary_cta_url: { type: [string, 'null'] }
        overlay_opacity: { type: [integer, 'null'] }
        sort_order: { type: integer }
        desktop_image:
          type: [object, 'null']
          properties:
            url: { type: string, format: uri }
            alt: { type: [string, 'null'] }
        mobile_image:
          type: [object, 'null']
          properties:
            url: { type: string, format: uri }
            alt: { type: [string, 'null'] }

    FeatureItemSectionEnum:
      type: string
      enum: [HOME_USP, HOME_WHY_US, ABOUT_VALUES, ABOUT_STRENGTH, QUALITY_COMMITMENT, DEALER_BENEFITS, CONTACT_ASSURANCE, PRODUCT_HIGHLIGHTS]

    ProcessStepGroupEnum:
      type: string
      enum: [FROM_GARDEN_TO_CUP, HOW_WE_MAKE_TEA, QUALITY_PROCESS, MANUFACTURING_PROCESS, BECOME_DEALER]

    StatCounterGroupEnum:
      type: string
      enum: [HOME, ABOUT, GALLERY, TEA_GARDEN, DEALER_NETWORK]

    FeatureItem:
      type: object
      description: |
        Icon rows grouped by `section` (doc §8.7, §10.1; RTPP-24). No soft
        delete — nothing references a feature item's id.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        section: { $ref: '#/components/schemas/FeatureItemSectionEnum' }
        title: { type: string }
        description: { type: [string, 'null'] }
        icon_name: { type: [string, 'null'] }
        icon_image_id: { type: [string, 'null'] }
        icon_bg_color: { type: [string, 'null'] }
        sort_order: { type: integer }
        is_active: { type: boolean }

    FeatureItemInput:
      type: object
      description: On create, `section` and `title` are required. On update, send only what is changing.
      required: [section, title]
      properties:
        section: { $ref: '#/components/schemas/FeatureItemSectionEnum' }
        title: { type: string, maxLength: 255 }
        description: { type: [string, 'null'] }
        icon_name: { type: [string, 'null'], maxLength: 64 }
        icon_image_id: { type: [string, 'null'], description: A media asset id (ULID). }
        icon_bg_color: { $ref: '#/components/schemas/HexColour' }
        sort_order: { type: integer }
        is_active: { type: boolean, default: true }

    ProcessStep:
      type: object
      description: |
        Numbered timeline entries grouped by `group` (doc §8.7, §10.4;
        RTPP-24). `(group, step_number)` is unique — enforced by
        `uq_process_steps_group_number`, not just an application check.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        group: { $ref: '#/components/schemas/ProcessStepGroupEnum' }
        step_number: { type: integer, minimum: 1 }
        title: { type: string }
        description: { type: [string, 'null'] }
        icon_name: { type: [string, 'null'] }
        image_id: { type: [string, 'null'] }
        sort_order: { type: integer }
        is_active: { type: boolean }

    ProcessStepInput:
      type: object
      description: |
        On create, `group`, `step_number` and `title` are required. On
        update, send only what is changing — a partial update touching only
        `step_number` is still checked against the step's own stored `group`.
      required: [group, step_number, title]
      properties:
        group: { $ref: '#/components/schemas/ProcessStepGroupEnum' }
        step_number: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 255 }
        description: { type: [string, 'null'] }
        icon_name: { type: [string, 'null'], maxLength: 64 }
        image_id: { type: [string, 'null'], description: A media asset id (ULID). }
        sort_order: { type: integer }
        is_active: { type: boolean, default: true }

    StatCounter:
      type: object
      description: 'The animated count-up bands, grouped by `group` (doc §8.7, §10.1; RTPP-24). `value` is a display string (''25+'', ''1000+'', ''100%''), not a number.'
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        group: { $ref: '#/components/schemas/StatCounterGroupEnum' }
        value: { type: string, example: 25+ }
        label: { type: string, example: Years of Experience }
        icon_name: { type: [string, 'null'] }
        sort_order: { type: integer }
        is_active: { type: boolean }

    StatCounterInput:
      type: object
      description: On create, `group`, `value` and `label` are required. On update, send only what is changing.
      required: [group, value, label]
      properties:
        group: { $ref: '#/components/schemas/StatCounterGroupEnum' }
        value: { type: string, maxLength: 32 }
        label: { type: string, maxLength: 255 }
        icon_name: { type: [string, 'null'], maxLength: 64 }
        sort_order: { type: integer }
        is_active: { type: boolean, default: true }

    Certification:
      type: object
      description: Logo plus a downloadable certificate PDF (doc §8.7, §10.4; RTPP-24). Flat — no grouping.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        subtitle: { type: [string, 'null'] }
        logo_id: { type: [string, 'null'] }
        certificate_file_id: { type: [string, 'null'] }
        sort_order: { type: integer }
        is_active: { type: boolean }

    CertificationInput:
      type: object
      description: On create, only `name` is required. On update, send only what is changing.
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        subtitle: { type: [string, 'null'], maxLength: 255 }
        logo_id: { type: [string, 'null'], description: A media asset id (ULID). }
        certificate_file_id: { type: [string, 'null'], description: A media asset id (ULID) — typically a PDF. }
        sort_order: { type: integer }
        is_active: { type: boolean, default: true }

    Testimonial:
      type: object
      description: 'Flat, `status`-gated rather than `is_active` (doc §8.7, §10.4; RTPP-24) — a testimonial can be a DRAFT awaiting moderation.'
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        author_name: { type: string }
        author_role: { type: [string, 'null'], example: 'Distributor, Chattogram' }
        avatar_id: { type: [string, 'null'] }
        quote: { type: string }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        sort_order: { type: integer }

    TestimonialInput:
      type: object
      description: "On create, `author_name` and `quote` are required. Defaults to `status: PUBLISHED`, the schema's own default."
      required: [author_name, quote]
      properties:
        author_name: { type: string, maxLength: 255 }
        author_role: { type: [string, 'null'], maxLength: 255 }
        avatar_id: { type: [string, 'null'], description: A media asset id (ULID). }
        quote: { type: string }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED], default: PUBLISHED }
        sort_order: { type: integer }

    PageBlock:
      type: object
      description: |
        Editable static-page sections keyed `(page_key, block_key)` (doc
        §8.7, §11; RTPP-24). `body` is sanitised HTML (`RichText::sanitize()`,
        same as a product's tab content) — the one genuinely rich-text field
        in this module.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        page_key: { type: string, example: about }
        block_key: { type: string, example: mission }
        eyebrow: { type: [string, 'null'] }
        heading: { type: [string, 'null'] }
        subheading: { type: [string, 'null'] }
        body: { type: [string, 'null'], description: Sanitised HTML. }
        bullet_points: { type: [array, 'null'], items: { type: string } }
        image_id: { type: [string, 'null'] }
        cta_label: { type: [string, 'null'] }
        cta_url: { type: [string, 'null'] }
        sort_order: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }

    PageBlockInput:
      type: object
      description: |
        On create, `page_key` and `block_key` are required — unique as a
        pair, exact-or-`409` (no auto-suffix; unlike a slug, an admin picking
        a wrong `block_key` should be told, not silently redirected to a
        different one). On update, send only what is changing.
      required: [page_key, block_key]
      properties:
        page_key: { type: string, maxLength: 64 }
        block_key: { type: string, maxLength: 64 }
        eyebrow: { type: [string, 'null'], maxLength: 255 }
        heading: { type: [string, 'null'], maxLength: 255 }
        subheading: { type: [string, 'null'], maxLength: 255 }
        body: { type: [string, 'null'], description: 'Rich text HTML, sanitised before storage.' }
        bullet_points: { type: array, items: { type: string } }
        image_id: { type: [string, 'null'], description: A media asset id (ULID). }
        cta_label: { type: [string, 'null'], maxLength: 128 }
        cta_url: { type: [string, 'null'], maxLength: 255 }
        sort_order: { type: integer }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED], default: PUBLISHED }

    GalleryCategory:
      type: object
      description: |
        The admin shape (doc §8.7, §9.5, §9.9; RTPP-25). The slug is globally
        unique, same reasoning as `Category`. This table carries no
        `created_at`/`updated_at` at all — absent from the schema, not
        omitted here.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        slug: { type: string, description: Globally unique — no brand to scope it by (§6). }
        description: { type: [string, 'null'] }
        icon_name: { type: [string, 'null'] }
        cover_image_id: { type: [string, 'null'] }
        sort_order: { type: integer }
        is_active: { type: boolean }

    GalleryCategoryInput:
      type: object
      description: |
        On create, only `name` is required — the same explicit-or-derived
        slug rule as `CategoryInput`. On update, send only what is changing.
      properties:
        name: { type: string, maxLength: 255 }
        slug:
          type: string
          description: 'Optional. Given exactly, or rejected with `409` if taken. Omit to derive one from `name`, auto-suffixed on collision.'
        description: { type: [string, 'null'] }
        icon_name: { type: [string, 'null'], maxLength: 64 }
        cover_image_id: { type: [string, 'null'], description: A media asset id (ULID). }
        sort_order: { type: integer }
        is_active: { type: boolean }

    GalleryImage:
      type: object
      description: |
        The admin shape (doc §8.7, §9.5, §9.9; RTPP-25). `sort_order` is
        scoped to one `category_id` — see `POST /admin/gallery/images/reorder`.
        No `deleted_at`; `DELETE` is a genuine hard delete.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        category_id: { $ref: '#/components/schemas/Ulid' }
        media_id: { $ref: '#/components/schemas/Ulid' }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'], maxLength: 512 }
        sort_order: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    GalleryImageInput:
      type: object
      description: |
        On create, `category_id` and `media_id` are both required —
        `media_id` is `NOT NULL` in the schema, unlike every other optional
        media reference in this codebase, because a gallery image *is* the
        media it points at. On update, send only what is changing.
      required: [category_id, media_id]
      properties:
        category_id: { $ref: '#/components/schemas/Ulid' }
        media_id: { $ref: '#/components/schemas/Ulid' }
        title: { type: [string, 'null'], maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 512 }
        sort_order: { type: integer }
        is_active: { type: boolean }

    GalleryImageBulkInput:
      type: object
      description: |
        The admin bulk-upload screen: several already-uploaded (RTPP-21
        sign-then-register) media assets, registered into one category in a
        single call. Every entry is validated before any of them is written
        — one bad `media_id` rejects the whole batch rather than leaving a
        partially-registered set (see `GalleryImageService`'s class doc).
        Each entry lands after whatever `sort_order` the category already has.
      required: [category_id, images]
      properties:
        category_id: { $ref: '#/components/schemas/Ulid' }
        images:
          type: array
          minItems: 1
          items:
            type: object
            required: [media_id]
            properties:
              media_id: { $ref: '#/components/schemas/Ulid' }
              title: { type: [string, 'null'], maxLength: 255 }
              description: { type: [string, 'null'], maxLength: 512 }

    PublicGalleryCategory:
      type: object
      description: 'The tab bar (`GET /public/gallery/categories`, doc §9.5). Active categories only.'
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        icon_name: { type: [string, 'null'] }
        cover_image: { $ref: '#/components/schemas/Image' }
        image_count:
          type: integer
          description: Active images only. Zero is a normal value — an empty category still renders in the tab bar.

    PublicGalleryImage:
      type: object
      description: 'One card in the masonry grid (`GET /public/gallery`, doc §9.5).'
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        category:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            name: { type: string }
            slug: { type: string }
        image:
          type: object
          properties:
            url: { type: string, format: uri }
            alt: { type: [string, 'null'] }

    NewsPost:
      type: object
      description: |
        The admin shape (doc §8.7, §9.9, §10.4; RTPP-26). `content` is
        sanitised HTML (`RichText::sanitize()`, same treatment as a page
        block's body). `author_id` is stamped from the authenticated admin at
        creation and is never client-settable. Publishing is `status` plus
        `published_at` together — see `NewsPostInput`'s description.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        title: { type: string }
        slug: { type: string, description: Globally unique — no brand to scope it by (§6). }
        excerpt: { type: [string, 'null'] }
        content: { type: string, description: Sanitised HTML. }
        cover_image_id: { type: [string, 'null'] }
        tags: { type: [array, 'null'], items: { type: string } }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        is_featured: { type: boolean }
        published_at:
          type: [string, 'null']
          format: date-time
          description: Null until first published. A future value schedules the post — invisible publicly until that moment passes.
        view_count: { type: integer }
        author_id: { type: [string, 'null'] }
        meta_title: { type: [string, 'null'] }
        meta_description: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NewsPostInput:
      type: object
      description: |
        On create, `title` and `content` are required. Setting `status:
        PUBLISHED` with no `published_at` publishes immediately (defaulted to
        "now" server-side); giving an explicit future `published_at` instead
        schedules it. On update, send only what is changing — a partial
        update touching only one of `status`/`published_at` is resolved
        against the post's *stored* other half, the same "effective value"
        reasoning `BannerInput`'s schedule window uses. `author_id` is not a
        field here: it cannot be set or changed through this API.
      required: [title, content]
      properties:
        title: { type: string, maxLength: 255 }
        slug:
          type: string
          description: 'Optional. Given exactly, or rejected with `409` if taken. Omit to derive one from `title`, auto-suffixed on collision.'
        excerpt: { type: [string, 'null'] }
        content: { type: string, description: 'Rich text HTML, sanitised before storage. Must contain visible content once disallowed markup is removed.' }
        cover_image_id: { type: [string, 'null'], description: A media asset id (ULID). }
        tags: { type: array, items: { type: string } }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED], default: DRAFT }
        is_featured: { type: boolean }
        published_at: { type: [string, 'null'], format: date-time }
        meta_title: { type: [string, 'null'], maxLength: 255 }
        meta_description: { type: [string, 'null'] }

    PublicNewsCard:
      type: object
      description: One card in the listing grid or the "Latest Updates" band (doc §9.5, §10.1).
      properties:
        title: { type: string }
        slug: { type: string }
        excerpt: { type: [string, 'null'] }
        published_at: { type: string, format: date-time }
        cover_image: { $ref: '#/components/schemas/Image' }

    PublicNewsPost:
      type: object
      description: |
        The full article (`GET /public/news/{slug}`, doc §9.5, §10.4).
        `previous`/`next` are the neighbouring posts in publish order — the
        older post and the newer post respectively — and either is `null` at
        its end of the list (the DoD's second headline item).
      properties:
        title: { type: string }
        slug: { type: string }
        excerpt: { type: [string, 'null'] }
        content: { type: string, description: Sanitised HTML. }
        tags: { type: [array, 'null'], items: { type: string } }
        published_at: { type: string, format: date-time }
        view_count: { type: integer, description: Incremented by this request itself. }
        author_name: { type: [string, 'null'] }
        cover_image: { $ref: '#/components/schemas/Image' }
        previous:
          type: [object, 'null']
          properties:
            slug: { type: string }
            title: { type: string }
        next:
          type: [object, 'null']
          properties:
            slug: { type: string }
            title: { type: string }

    ReviewInput:
      type: object
      description: |
        `rating` and `comment` are required on create; on update (`PATCH
        /public/my/reviews/{id}`) send only what is changing. Editing always
        resets `status` to `PENDING` — see `ReviewRepository`'s class doc.
        There is no `status`/`author`/`product_id` field here: none of those
        are ever client-settable.
      required: [rating, comment]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: [string, 'null'], maxLength: 255 }
        comment: { type: string }

    Review:
      type: object
      description: The admin shape (doc §8.6, §9.10, §11; RTPP-27), with product and customer context joined in for the moderation queue.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        product:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            name: { type: string }
            slug: { type: string }
        customer:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            name: { type: string }
            email: { type: string, format: email }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: [string, 'null'] }
        comment: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        moderated_by_id: { type: [string, 'null'] }
        moderated_at: { type: [string, 'null'], format: date-time }
        rejection_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OwnReview:
      type: object
      description: '`GET /public/my/reviews` (doc §9.7) — no product/customer join, no moderator id: a customer sees their own content and its status, not who moderated it.'
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        product:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            name: { type: string }
            slug: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: [string, 'null'] }
        comment: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejection_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PublicReview:
      type: object
      description: One approved review on the product's reviews tab (doc §9.4, §10.2).
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: [string, 'null'] }
        comment: { type: string }
        customer_name: { type: string }
        created_at: { type: string, format: date-time }

    RejectReviewInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 512 }

    BulkReviewIdsInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { $ref: '#/components/schemas/Ulid' }
          minItems: 1

    BulkRejectReviewsInput:
      type: object
      required: [ids, reason]
      properties:
        ids:
          type: array
          items: { $ref: '#/components/schemas/Ulid' }
          minItems: 1
        reason: { type: string, maxLength: 512 }

    PublicCategory:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        icon_name: { type: [string, 'null'] }
        image: { $ref: '#/components/schemas/Image' }
        product_count:
          type: integer
          description: Published, non-deleted products only. Zero is a normal value, not an omission.

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    ProductCategoryRef:
      type: object
      description: The breadcrumb- and filter-bar-sized view of a product's category — not the full `Category`/`PublicCategory` shape.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        slug: { type: string }

    ProductCard:
      type: object
      description: |
        The shape returned by `GET /public/products` and
        `GET /public/products/{slug}/related` (doc §10.2's product-card grid
        is one component serving both). `price`/`compare_price`/
        `discount_percent` come from whichever pack size the product marked
        `is_default`, or its cheapest one if none is — never a client-chosen
        size — and are `null` for a product with no pack sizes yet.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        slug: { type: string }
        short_description: { type: [string, 'null'], description: Card blurb. }
        tagline: { type: [string, 'null'] }
        badge_text: { type: [string, 'null'], example: BEST SELLER }
        badge_color: { type: [string, 'null'] }
        is_featured: { type: boolean }
        rating_average: { type: number }
        rating_count: { type: integer }
        price: { type: [number, 'null'] }
        compare_price: { type: [number, 'null'] }
        discount_percent: { type: [integer, 'null'] }
        image:
          type: [object, 'null']
          description: The product's primary image, or its first by sort order if none is marked primary. Null if it has no images yet.
          properties:
            url: { type: string, format: uri }
            alt: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/ProductCategoryRef' }

    WishlistAddInput:
      type: object
      required: [productId]
      properties:
        productId: { $ref: '#/components/schemas/Ulid' }

    WishlistMergeInput:
      type: object
      description: |
        A guest's local wishlist, posted once at login (doc §8.6). Any id
        that does not resolve to a currently published product is skipped
        rather than failing the whole call — a guest's local storage is
        client-controlled and can easily carry a stale id.
      required: [productIds]
      properties:
        productIds:
          type: array
          items: { $ref: '#/components/schemas/Ulid' }

    EnquirySubmission:
      type: object
      description: |
        `POST /public/enquiries` (doc §9.6). `product_id` is optional — a
        general enquiry not tied to one product is still valid. Never
        client-settable: `status`, `assigned_to_id`, `internal_notes`,
        `reference_no`, `customer_id` (taken from an optional customer
        token if present), and `ip_address` (from the request itself).
        `recaptcha_token` and `website` are RTPP-34's form-protection pair —
        see `VerifyHuman`'s class doc.
      required: [name, phone, email, city, message]
      properties:
        product_id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string, maxLength: 255 }
        company_name: { type: [string, 'null'], maxLength: 255 }
        phone: { type: string, maxLength: 32 }
        email: { type: string, format: email, maxLength: 255 }
        city: { type: string, maxLength: 128 }
        pack_size_label: { type: [string, 'null'], maxLength: 64, example: 1kg }
        quantity: { type: [string, 'null'], maxLength: 64, example: 50 kg }
        message: { type: string }
        source_page: { type: [string, 'null'], maxLength: 255 }
        recaptcha_token: { type: string, description: 'A reCAPTCHA v3 token for the "enquiry" action.' }
        website: { type: string, description: Honeypot — must stay empty; a real visitor never sees or fills this field. }

    EnquirySubmissionResult:
      type: object
      description: 'The DoD''s "the reference is returned to the visitor on success" — nothing else, on a public unauthenticated endpoint.'
      properties:
        referenceNo: { type: string, example: RDFP-ENQ-2026-00841 }

    Enquiry:
      type: object
      description: The admin shape (doc §8.8, §9.10, §11; RTPP-29), with product and assignee context joined in.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        reference_no: { type: string, example: RDFP-ENQ-2026-00841 }
        product:
          type: [object, 'null']
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            name: { type: string }
            slug: { type: string }
        customer_id: { type: [string, 'null'], description: Set only if the visitor was signed in at submission. }
        name: { type: string }
        company_name: { type: [string, 'null'] }
        phone: { type: string }
        email: { type: string, format: email }
        city: { type: string }
        pack_size_label: { type: [string, 'null'] }
        quantity: { type: [string, 'null'] }
        message: { type: string }
        status: { type: string, enum: [NEW, IN_PROGRESS, CONTACTED, CLOSED, SPAM] }
        assigned_to:
          type: [object, 'null']
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            name: { type: string }
        internal_notes: { type: [string, 'null'] }
        source_page: { type: [string, 'null'] }
        ip_address: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EnquiryUpdateInput:
      type: object
      description: Send only what is changing — status, assignee, and internal notes are the only fields an admin may change here.
      properties:
        status: { type: string, enum: [NEW, IN_PROGRESS, CONTACTED, CLOSED, SPAM] }
        assigned_to_id: { $ref: '#/components/schemas/Ulid' }
        internal_notes: { type: [string, 'null'] }

    EnquiryExport:
      type: object
      description: |
        CSV content inside the standard envelope rather than a
        `Content-Type: text/csv` file download — `Kernel`'s own class doc
        states nothing leaves it except a section 9.1 envelope, and this
        ticket has no mandate to extend that pipeline. The dashboard turns
        `csv` into a client-side download (a `Blob` and an anchor click)
        exactly as it would consume a streamed file.
      properties:
        filename: { type: string, example: enquiries-2026-09-13.csv }
        csv: { type: string }

    District:
      type: object
      description: One of the 64 districts of Bangladesh (doc §8.8, §9.6, §10.3; RTPP-30), from `LocationSeeder`.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string, example: Dhaka }
        name_bn: { type: [string, 'null'] }
        division_name: { type: [string, 'null'], example: Dhaka }

    Upazila:
      type: object
      description: An upazila belonging to one district — the dependent dropdown's options.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        district_id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        name_bn: { type: [string, 'null'] }

    DealerApplicationSubmission:
      type: object
      description: |
        `POST /public/dealer-applications` (doc §9.6, §10.3). `upazila_id`
        must belong to `district_id`, or the submission is rejected naming
        `upazila_id`. Never client-settable: `status`, `assigned_to_id`,
        `internal_notes`, `reviewed_at`, `application_id`, and `ip_address`
        (from the request itself).
      required: [full_name, company_name, phone, email, district_id, upazila_id]
      properties:
        full_name: { type: string, maxLength: 255 }
        company_name: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 32 }
        email: { type: string, format: email, maxLength: 255 }
        district_id: { $ref: '#/components/schemas/Ulid' }
        upazila_id: { $ref: '#/components/schemas/Ulid' }
        address_line: { type: [string, 'null'], maxLength: 255 }
        has_trade_license: { type: boolean, default: false }
        has_tin_certificate: { type: boolean, default: false }
        years_of_experience: { type: [integer, 'null'], minimum: 0, description: 'Absent stays null — distinct from 0 years.' }
        message: { type: [string, 'null'] }
        recaptcha_token: { type: string, description: 'A reCAPTCHA v3 token for the "dealer_application" action (RTPP-34).' }
        website: { type: string, description: Honeypot — must stay empty; a real visitor never sees or fills this field. }

    DealerApplicationSubmissionResult:
      type: object
      description: The modal payload the design requires (doc §10.3) — nothing else, on a public unauthenticated endpoint.
      properties:
        applicationId: { type: string, example: RDFP-DA-2026-05120 }
        submittedAt: { type: string, format: date-time }
        expectedResponseWindow:
          type: string
          example: 2-3 business days
          description: Admin-configurable (`settings.dealer_application_response_window`) — the document names no confirmed SLA text.

    DealerApplication:
      type: object
      description: The admin shape (doc §8.8, §9.10, §10.3; RTPP-30), with district, upazila, and assignee context joined in.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        application_id: { type: string, example: RDFP-DA-2026-05120 }
        full_name: { type: string }
        company_name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        district:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            name: { type: string }
        upazila:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            name: { type: string }
        address_line: { type: [string, 'null'] }
        has_trade_license: { type: boolean }
        has_tin_certificate: { type: boolean }
        years_of_experience: { type: [integer, 'null'] }
        message: { type: [string, 'null'] }
        status: { type: string, enum: [SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, ON_HOLD] }
        assigned_to:
          type: [object, 'null']
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            name: { type: string }
        internal_notes: { type: [string, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time, description: Stamped when `status` first moves away from `SUBMITTED`. }
        ip_address: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DealerApplicationUpdateInput:
      type: object
      description: Send only what is changing — status, assignee, and internal notes are the only fields an admin may change here.
      properties:
        status: { type: string, enum: [SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, ON_HOLD] }
        assigned_to_id: { $ref: '#/components/schemas/Ulid' }
        internal_notes: { type: [string, 'null'] }

    DealerApplicationExport:
      type: object
      description: |
        CSV content inside the standard envelope rather than a
        `Content-Type: text/csv` file download — the same reasoning as
        `EnquiryExport`.
      properties:
        filename: { type: string, example: dealer-applications-2026-09-14.csv }
        csv: { type: string }

    ContactMessageSubmission:
      type: object
      description: |
        `POST /public/contact` (doc §9.6, §11; RTPP-31). Never
        client-settable: `status`, `replied_at`, `internal_notes`, and
        `ip_address` (from the request itself).
      required: [name, email, message]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: [string, 'null'], maxLength: 32 }
        subject: { type: [string, 'null'], maxLength: 255 }
        message: { type: string }
        recaptcha_token: { type: string, description: 'A reCAPTCHA v3 token for the "contact" action (RTPP-34).' }
        website: { type: string, description: Honeypot — must stay empty; a real visitor never sees or fills this field. }

    ContactMessage:
      type: object
      description: The admin shape (doc §8.8, §9.10, §11; RTPP-31). No assignee and no `updated_at` — the schema tracks only `created_at` and `replied_at`.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        subject: { type: [string, 'null'] }
        message: { type: string }
        status: { type: string, enum: [UNREAD, READ, REPLIED, ARCHIVED] }
        replied_at: { type: [string, 'null'], format: date-time, description: Stamped whenever `status` is set to `REPLIED`. }
        internal_notes: { type: [string, 'null'] }
        ip_address: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    ContactMessageUpdateInput:
      type: object
      description: Send only what is changing — status and internal notes are the only fields an admin may change here.
      properties:
        status: { type: string, enum: [UNREAD, READ, REPLIED, ARCHIVED] }
        internal_notes: { type: [string, 'null'] }

    NewsletterSubscribeInput:
      type: object
      description: '`POST /public/newsletter/subscribe` (doc §9.6, §11; RTPP-31).'
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        source: { type: [string, 'null'], maxLength: 64, example: footer, description: "Free text — e.g. 'footer', 'home_strip'." }
        recaptcha_token: { type: string, description: 'A reCAPTCHA v3 token for the "newsletter" action (RTPP-34).' }
        website: { type: string, description: Honeypot — must stay empty; a real visitor never sees or fills this field. }

    NewsletterSubscriptionResult:
      type: object
      description: Returned by both subscribe and unsubscribe — `subscribed` reflects the resulting state.
      properties:
        email: { type: string, format: email }
        subscribed: { type: boolean }

    NewsletterSubscriber:
      type: object
      description: The admin shape (doc §8.8, §9.10, §11; RTPP-31). `unsubscribe_token` is deliberately not exposed — it is the unauthenticated unsubscribe link's only credential.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        email: { type: string, format: email }
        is_subscribed: { type: boolean }
        source: { type: [string, 'null'] }
        subscribed_at: { type: string, format: date-time }
        unsubscribed_at: { type: [string, 'null'], format: date-time }

    NewsletterExport:
      type: object
      description: |
        CSV content inside the standard envelope rather than a
        `Content-Type: text/csv` file download — the same reasoning as
        `EnquiryExport`.
      properties:
        filename: { type: string, example: newsletter-subscribers-2026-09-14.csv }
        csv: { type: string }

    Setting:
      type: object
      description: One row of `settings` (doc §8.2; RTPP-32) — always a string; the schema has no type column, so interpretation belongs to the reader.
      properties:
        key: { type: string, example: enquiry_notify_emails }
        value: { type: string, example: 'sales@rajdhanitea.com,manager@rajdhanitea.com' }
        group: { type: [string, 'null'], enum: [notifications, analytics, general, null], example: notifications }

    SettingsUpdateInput:
      type: object
      description: Every entry's `key` must already exist — see `PUT /admin/settings`'s description.
      required: [settings]
      properties:
        settings:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, value]
            properties:
              key: { type: string }
              value: { type: string }

    MenuLinkInput:
      type: object
      description: '`POST`/`PATCH /admin/menu-links` (doc §8.2, §9.8, §10.5; RTPP-32).'
      properties:
        location: { type: string, enum: [header, footer_quick, footer_products, legal] }
        label: { type: string, maxLength: 128 }
        url: { type: string, maxLength: 255 }
        parent_id: { $ref: '#/components/schemas/Ulid' }
        sort_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }
        open_in_new_tab: { type: boolean, default: false }

    AdminMenuLink:
      type: object
      description: The admin shape — the public `MenuLink` (in `Layout`) omits `location`, `sort_order` and `is_active`, since `GET /public/layout` already groups by location and returns only active links.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        location: { type: string, enum: [header, footer_quick, footer_products, legal] }
        label: { type: string }
        url: { type: string }
        parent_id: { type: [string, 'null'] }
        sort_order: { type: integer }
        is_active: { type: boolean }
        open_in_new_tab: { type: boolean }

    SocialLinkInput:
      type: object
      description: |
        `POST`/`PATCH /admin/social-links` (doc §8.2, §9.8, §10.5; RTPP-32).
        `platform` is free text — the schema column is `VARCHAR(64)`, not an
        `ENUM`.
      properties:
        platform: { type: string, maxLength: 64, example: facebook }
        url: { type: string, maxLength: 255 }
        icon_name: { type: [string, 'null'], maxLength: 64 }
        sort_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }

    SocialLink:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        platform: { type: string }
        url: { type: string }
        icon_name: { type: [string, 'null'] }
        sort_order: { type: integer }
        is_active: { type: boolean }

    DownloadInput:
      type: object
      description: '`POST`/`PATCH /admin/downloads` (doc §8.7, §9.9; RTPP-32). `key` must be unique, lowercase letters/digits/underscores only.'
      properties:
        title: { type: string, maxLength: 255, example: Dealer Brochure }
        key: { type: string, maxLength: 64, pattern: '^[a-z0-9_]+$', example: dealer_brochure }
        description: { type: [string, 'null'], maxLength: 512 }
        file_id: { $ref: '#/components/schemas/Ulid' }
        requires_email: { type: boolean, default: false, description: "Stored but not enforced by GET /public/downloads/{key} — see that route's description." }
        is_active: { type: boolean, default: true }

    Download:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        title: { type: string }
        key: { type: string }
        description: { type: [string, 'null'] }
        file:
          type: [object, 'null']
          properties:
            id: { $ref: '#/components/schemas/Ulid' }
            url: { type: string }
        requires_email: { type: boolean }
        download_count: { type: integer }
        is_active: { type: boolean }

    DownloadResolution:
      type: object
      description: '`GET /public/downloads/{key}`''s response — nothing else, on a public unauthenticated endpoint.'
      properties:
        title: { type: string }
        description: { type: [string, 'null'] }
        url: { type: string }

    PublicProduct:
      type: object
      description: |
        `GET /public/products/{slug}` (doc §9.4, §10.2): tab content, pack
        sizes, highlights, images, the rating summary and SEO meta in one
        payload — everything the detail page needs, and nothing an admin
        screen needs that a customer should not see (`status`, `view_count`,
        timestamps are all admin-only and are not part of this shape).
        Returned only for a `PUBLISHED`, non-deleted product; any other slug
        is a `404` indistinguishable from one that never existed (§9.4).
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        slug: { type: string }
        short_description: { type: [string, 'null'] }
        tagline: { type: [string, 'null'] }
        description: { type: [string, 'null'], description: 'Sanitised HTML. Null means: hide this tab.' }
        ingredients: { type: [string, 'null'], description: Sanitised HTML. }
        nutrition_info: { type: [string, 'null'], description: Sanitised HTML. }
        brewing_guide: { type: [string, 'null'], description: Sanitised HTML. }
        packaging_info: { type: [string, 'null'], description: Sanitised HTML. }
        key_features: { type: [array, 'null'], items: { type: string } }
        badge_text: { type: [string, 'null'], example: BEST SELLER }
        badge_color: { type: [string, 'null'] }
        rating_average: { type: number }
        rating_count: { type: integer }
        meta_title: { type: [string, 'null'] }
        meta_description: { type: [string, 'null'] }
        category: { $ref: '#/components/schemas/ProductCategoryRef' }
        pack_sizes: { type: array, items: { $ref: '#/components/schemas/PackSize' } }
        highlights: { type: array, items: { $ref: '#/components/schemas/Highlight' } }
        images: { type: array, items: { $ref: '#/components/schemas/ProductImage' } }

    ProductSummary:
      type: object
      description: The shape returned by the list endpoint — enough to render a table row.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        category_id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        is_featured: { type: boolean }
        sort_order: { type: integer }
        updated_at: { type: string, format: date-time }

    Product:
      type: object
      description: The full shape — every route except the list returns this, children included.
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        category_id: { $ref: '#/components/schemas/Ulid' }
        name: { type: string }
        slug: { type: string, description: Globally unique. }
        short_description: { type: [string, 'null'], description: Card blurb. }
        tagline: { type: [string, 'null'] }
        description: { type: [string, 'null'], description: 'Sanitised HTML. Null means: hide this tab.' }
        ingredients: { type: [string, 'null'], description: Sanitised HTML. }
        nutrition_info: { type: [string, 'null'], description: Sanitised HTML. }
        brewing_guide: { type: [string, 'null'], description: Sanitised HTML. }
        packaging_info: { type: [string, 'null'], description: Sanitised HTML. }
        key_features: { type: [array, 'null'], items: { type: string } }
        badge_text: { type: [string, 'null'], example: BEST SELLER }
        badge_color: { type: [string, 'null'] }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        is_featured: { type: boolean, description: Included in the home carousel. }
        sort_order: { type: integer }
        view_count: { type: integer, description: 'Owned by traffic, not writable here.'}
        rating_average: { type: number, description: 'Owned by the review module (RTPP-27), not writable here.'}
        rating_count: { type: integer, description: 'Owned by the review module (RTPP-27), not writable here.'}
        meta_title: { type: [string, 'null'] }
        meta_description: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pack_sizes: { type: array, items: { $ref: '#/components/schemas/PackSize' } }
        highlights: { type: array, items: { $ref: '#/components/schemas/Highlight' } }
        images: { type: array, items: { $ref: '#/components/schemas/ProductImage' } }

    ProductInput:
      type: object
      description: |
        On create, `name` and `category_id` are required. On update, every
        field is optional — send only what is changing. `pack_sizes`,
        `highlights` and `images`, when present, **replace** the product's
        entire current set for that collection in the same transaction — not
        a diff, a replacement, matching a tabbed form's "current contents of
        this tab" submission.
      properties:
        name: { type: string, maxLength: 255 }
        category_id: { $ref: '#/components/schemas/Ulid' }
        slug:
          type: string
          description: |
            Optional. Given exactly, or `409` if taken. Omitted on create, one
            is derived from `name`. Omitted on update, the existing slug is
            left untouched even if `name` changes.
        short_description: { type: [string, 'null'] }
        tagline: { type: [string, 'null'], maxLength: 255 }
        description: { type: [string, 'null'], description: 'Rich text HTML, sanitised before storage.' }
        ingredients: { type: [string, 'null'] }
        nutrition_info: { type: [string, 'null'] }
        brewing_guide: { type: [string, 'null'] }
        packaging_info: { type: [string, 'null'] }
        key_features: { type: array, items: { type: string } }
        badge_text: { type: [string, 'null'], maxLength: 64 }
        badge_color: { $ref: '#/components/schemas/HexColour' }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED], default: DRAFT }
        is_featured: { type: boolean, default: false }
        sort_order: { type: integer }
        meta_title: { type: [string, 'null'], maxLength: 255 }
        meta_description: { type: [string, 'null'] }
        pack_sizes: { type: array, items: { $ref: '#/components/schemas/PackSizeInput' } }
        highlights: { type: array, items: { $ref: '#/components/schemas/HighlightInput' } }
        images: { type: array, items: { $ref: '#/components/schemas/ProductImageInput' } }

    PackSize:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        label: { type: string, example: 500g }
        sku: { type: string, description: Globally unique across every product. }
        price: { type: number }
        compare_price: { type: [number, 'null'], description: 'Struck-through original, if discounted.'}
        discount_percent: { type: [integer, 'null'], description: Derived from price and compare_price — never client-supplied. }
        price_includes_vat: { type: boolean }
        is_default: { type: boolean, description: At most one pack size per product. }
        is_available: { type: boolean }
        sort_order: { type: integer }

    PackSizeInput:
      type: object
      description: On create, `label`, `sku` and `price` are required. On update, send only what is changing.
      properties:
        label: { type: string, maxLength: 64 }
        sku: { type: string, maxLength: 64 }
        price: { type: number, minimum: 0 }
        compare_price: { type: [number, 'null'], minimum: 0 }
        price_includes_vat: { type: boolean, default: true }
        is_default: { type: boolean, default: false }
        is_available: { type: boolean, default: true }
        sort_order: { type: integer }

    Highlight:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        title: { type: string, example: 100% Natural }
        subtitle: { type: [string, 'null'] }
        icon_name: { type: [string, 'null'] }
        sort_order: { type: integer }

    HighlightInput:
      type: object
      description: On create, `title` is required. On update, send only what is changing.
      properties:
        title: { type: string, maxLength: 255 }
        subtitle: { type: [string, 'null'], maxLength: 255 }
        icon_name: { type: [string, 'null'], maxLength: 64 }
        sort_order: { type: integer }

    ProductImage:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        media_id: { $ref: '#/components/schemas/Ulid' }
        url: { type: string, format: uri }
        alt: { type: [string, 'null'] }
        is_primary: { type: boolean, description: At most one image per product. }
        sort_order: { type: integer }

    ProductImageInput:
      type: object
      description: On create, `media_id` is required. On update, send only what is changing.
      properties:
        media_id: { $ref: '#/components/schemas/Ulid' }
        is_primary: { type: boolean, default: false }
        sort_order: { type: integer }

    MediaSignature:
      type: object
      description: |
        What `POST /admin/media/signature` returns: enough for the browser to
        upload directly to Cloudinary without this API ever seeing the file
        (doc §12). `signature` authorises exactly `folder` and `timestamp` —
        any other parameter added to the upload request invalidates it.
      properties:
        cloud_name: { type: string }
        api_key: { type: string }
        timestamp: { type: integer, description: Unix seconds. Part of what was signed; must be sent back unchanged. }
        signature: { type: string }
        folder: { type: string, example: rajdhani/products }
        resource_type: { type: string, enum: [image, raw] }
        upload_url: { type: string, format: uri, description: 'Convenience only — derivable from cloud_name and resource_type.' }

    MediaAsset:
      type: object
      description: A registered `media_assets` row (doc §8.1, §12).
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        public_id: { type: string, description: Cloudinary's identifier for the asset. Globally unique here too. }
        secure_url: { type: string, format: uri }
        type: { type: string, enum: [IMAGE, VIDEO, DOCUMENT] }
        format: { type: [string, 'null'], example: jpg }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'], description: Null for a document; Cloudinary reports no dimensions for one. }
        bytes: { type: [integer, 'null'] }
        folder: { type: [string, 'null'], example: rajdhani/products }
        alt_text: { type: [string, 'null'] }
        caption: { type: [string, 'null'] }
        uploaded_by_id: { $ref: '#/components/schemas/Ulid' }
        created_at: { type: string, format: date-time }

    MediaAssetWithUsage:
      description: '`MediaAsset` plus where it is referenced (RTPP-91) — `GET /admin/media/{id}` only.'
      allOf:
        - $ref: '#/components/schemas/MediaAsset'
        - type: object
          properties:
            usage:
              type: array
              description: Empty when nothing references this asset — the case `DELETE` would succeed on.
              items:
                type: object
                properties:
                  table: { type: string, example: categories }
                  count: { type: integer }
                  label: { type: string, example: 'category image(s)' }

    MediaUpdateInput:
      type: object
      minProperties: 1
      description: Send at least one of the two. Neither is required on its own.
      properties:
        alt_text: { type: [string, 'null'], maxLength: 255 }
        caption: { type: [string, 'null'], maxLength: 512 }

    MediaSignatureInput:
      type: object
      required: [resource, resource_type]
      properties:
        resource:
          type: string
          description: |
            The `{resource}` segment of `rajdhani/{resource}` (doc §12) — for
            example `products`, `banners`, `gallery`. Sanitised into a safe
            folder segment server-side; not a fixed enum.
        resource_type: { type: string, enum: [image, raw] }

    MediaRegisterInput:
      type: object
      description: |
        The fields Cloudinary's own upload API response carries, forwarded
        as-is by the browser after a successful direct upload — this API
        never sees the file itself, only what Cloudinary reports about it.
        `public_id`, `version` and `signature` together are what
        `POST /admin/media` verifies before trusting anything else in the
        body (see `MediaAsset`'s class doc and RTPP-21's Jira comment for
        exactly what that signature does and does not authenticate).
      required: [public_id, version, signature, resource_type, format, bytes, secure_url]
      properties:
        public_id: { type: string }
        version:
          type: string
          description: "Sent as a string; Cloudinary's own response gives it as a number, but only its text matters for the signature."
        signature: { type: string }
        resource_type: { type: string, enum: [image, raw] }
        format: { type: string, example: jpg }
        bytes: { type: integer, minimum: 1 }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        secure_url: { type: string, format: uri }
        alt_text: { type: [string, 'null'], maxLength: 255 }
        caption: { type: [string, 'null'], maxLength: 512 }

    SiteProfile:
      type: object
      properties:
        name: { type: string }
        tagline: { type: [string, 'null'] }
        logos:
          type: object
          properties:
            light: { $ref: '#/components/schemas/Image' }
            dark: { $ref: '#/components/schemas/Image' }
            favicon: { $ref: '#/components/schemas/Image' }
            og: { $ref: '#/components/schemas/Image' }
        theme:
          type: object
          description: Apply as CSS custom properties. Never hard-code these values.
          properties:
            primary: { type: string, example: '#1B5E20'  }
            secondary: { type: string, example: '#C9A227'  }
            accent: { type: string, example: '#FFFFFF'  }
        contact:
          type: object
          properties:
            address_line: { type: [string, 'null'] }
            city: { type: [string, 'null'] }
            country: { type: [string, 'null'] }
            phone_primary: { type: [string, 'null'] }
            phone_secondary: { type: [string, 'null'] }
            email_primary: { type: [string, 'null'] }
            email_secondary: { type: [string, 'null'] }
            website_url: { type: [string, 'null'] }
            business_hours: { type: [string, 'null'] }
        map:
          type: object
          description: |
            Coordinates are `null` when unset, **not** `0`. (0, 0) is a real place
            in the Gulf of Guinea; render no map rather than that one.
          properties:
            latitude: { type: [number, 'null'] }
            longitude: { type: [number, 'null'] }
            embed_url: { type: [string, 'null'] }
        footer:
          type: object
          properties:
            about: { type: [string, 'null'] }
            copyright: { type: [string, 'null'] }
        seo:
          type: object
          properties:
            meta_title: { type: [string, 'null'] }
            meta_description: { type: [string, 'null'] }

    MenuLink:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Ulid' }
        label: { type: string }
        url: { type: string }
        parent_id: { type: [string, 'null'] }
        open_in_new_tab: { type: boolean }

    Layout:
      type: object
      properties:
        site: { $ref: '#/components/schemas/SiteProfile' }
        menus:
          type: object
          description: |
            Every location is always present, `[]` when empty — so indexing into
            one is safe even if an editor deactivated every link in it.
          properties:
            header: { type: array, items: { $ref: '#/components/schemas/MenuLink' } }
            footer_quick: { type: array, items: { $ref: '#/components/schemas/MenuLink' } }
            footer_products: { type: array, items: { $ref: '#/components/schemas/MenuLink' } }
            legal: { type: array, items: { $ref: '#/components/schemas/MenuLink' } }
        social:
          type: array
          items:
            type: object
            properties:
              platform: { type: string, example: facebook  }
              url: { type: string, format: uri }
              icon_name: { type: [string, 'null'] }
        newsletter:
          type: object
          properties:
            enabled: { type: boolean, description: Whether to render the footer sign-up form.  }

    SiteProfileUpdate:
      type: object
      minProperties: 1
      description: Send only what is changing. Unknown fields are ignored.
      properties:
        name: { type: string, maxLength: 255 }
        tagline: { type: [string, 'null'], maxLength: 255 }
        logo_light_id: { type: [string, 'null'] }
        logo_dark_id: { type: [string, 'null'] }
        favicon_id: { type: [string, 'null'] }
        og_image_id: { type: [string, 'null'] }
        primary_color: { $ref: '#/components/schemas/HexColour' }
        secondary_color: { $ref: '#/components/schemas/HexColour' }
        accent_color: { $ref: '#/components/schemas/HexColour' }
        address_line: { type: [string, 'null'], maxLength: 255 }
        city: { type: [string, 'null'], maxLength: 128 }
        country: { type: [string, 'null'], maxLength: 128 }
        phone_primary: { type: [string, 'null'], maxLength: 32 }
        phone_secondary: { type: [string, 'null'], maxLength: 32 }
        email_primary: { type: [string, 'null'], format: email }
        email_secondary: { type: [string, 'null'], format: email }
        website_url: { type: [string, 'null'], maxLength: 255 }
        business_hours: { type: [string, 'null'], maxLength: 255 }
        map_latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
        map_longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        map_embed_url: { type: [string, 'null'] }
        footer_about: { type: [string, 'null'] }
        copyright_text: { type: [string, 'null'], maxLength: 255 }
        meta_title: { type: [string, 'null'], maxLength: 255 }
        meta_description: { type: [string, 'null'] }

    HexColour:
      type: string
      pattern: '^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$'
      example: '#1B5E20'

    AuditLogEntry:
      type: object
      description: One row of `audit_logs` (RTPP-35).
      properties:
        id: { type: string }
        admin_id: { type: [string, 'null'] }
        admin_name: { type: [string, 'null'], description: 'Null if the admin account has since been removed.' }
        admin_email: { type: [string, 'null'] }
        action: { type: string, example: 'banner.update' }
        entity_type: { type: string, example: 'Banner' }
        entity_id: { type: [string, 'null'], description: 'Null for a bulk action with no single row, such as a reorder or a bulk-approve.' }
        before:
          type: [object, 'null']
          description: 'Only the fields that changed. Null for a create.'
          additionalProperties: true
        after:
          type: [object, 'null']
          description: 'Only the fields that changed. Null for a delete.'
          additionalProperties: true
        ip_address: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    HomePayload:
      type: object
      description: '`GET /public/home`''s composed body (RTPP-36).'
      properties:
        banners:
          type: array
          items: { $ref: '#/components/schemas/PublicBanner' }
        featured_products:
          type: array
          items: { $ref: '#/components/schemas/ProductCard' }
        stats:
          type: array
          items: { $ref: '#/components/schemas/HomeStat' }
        news:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/PublicNewsCard' }
        testimonials:
          type: array
          items: { $ref: '#/components/schemas/HomeTestimonial' }

    HomeStat:
      type: object
      description: One `StatCounter` row, group `HOME` (doc §10.1).
      properties:
        id: { type: string }
        value: { type: string, example: '25+', description: 'A display string, not a number to compute with.' }
        label: { type: string }
        icon_name: { type: [string, 'null'] }

    HomeTestimonial:
      type: object
      properties:
        id: { type: string }
        author_name: { type: string }
        author_role: { type: [string, 'null'] }
        quote: { type: string }
        rating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        avatar:
          type: [object, 'null']
          properties:
            url: { type: string }
            alt: { type: [string, 'null'] }

    DashboardSummary:
      type: object
      description: '`GET /admin/dashboard/summary`''s composed body (doc §9, §11; RTPP-36).'
      properties:
        counts:
          type: object
          description: '`pending_reviews` is omitted entirely for a Sales admin — see the endpoint description.'
          properties:
            new_enquiries: { type: integer }
            new_applications: { type: integer }
            unread_messages: { type: integer }
            pending_reviews: { type: integer }
            subscribers: { type: integer }
        chart:
          type: array
          description: 30 days, oldest first, zero-filled.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              enquiries: { type: integer }
              applications: { type: integer }
              messages: { type: integer }
        recent_leads:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [enquiry, dealer_application, contact_message] }
              id: { type: string }
              name: { type: string }
              email: { type: string }
              created_at: { type: string, format: date-time }
