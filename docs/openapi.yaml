        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      summary: Update a pack size
      description: |
        Send only what is changing. Updating only one of `price` /
        `compare_price` still recomputes `discount_percent` correctly — the
        untouched price is read back from the stored row, not treated as
        absent.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/PackSizeId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackSizeInput' }
      responses:
        '200':
          description: Updated.
          content:
