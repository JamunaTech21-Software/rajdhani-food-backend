      description: |
        Recalculates the product's `rating_average`/`rating_count` inside a
        transaction (doc §8.5). Not restricted to reviews currently
        `PENDING` — approving an already-`REJECTED` review is a supported
        transition.
      security: [{ adminBearer: [] }]
      parameters:
