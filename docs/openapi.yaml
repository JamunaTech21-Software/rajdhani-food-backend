      summary: Approve several reviews at once
      description: |
        Applies to every id that still exists and reports the rest as
        missing (doc §11's "bulk actions") — the same "apply what you can"
        contract `/admin/categories/reorder` uses for a batch of independent
        existing rows.
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkReviewIdsInput' }
      responses:
